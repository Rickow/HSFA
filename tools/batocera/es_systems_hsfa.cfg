<?xml version="1.0" encoding="UTF-8"?>
<!-- Systeme « HSFA » pour Batocera (v43 et plus), fichier additionnel de l'interface (EmulationStation).
     A copier dans /userdata/system/configs/emulationstation/es_systems_hsfa.cfg (partage reseau : system/configs/emulationstation/).
     NE PAS le nommer es_systems_custom.cfg : ce nom-la REMPLACE toute la liste des systemes de Batocera.
     Les jeux vont dans /userdata/roms/hsfa/ (partage : roms/hsfa/), sans les renommer.
     Coeurs : fbneo_hsfa (4:3, par defaut) et fbneo_hsfaws (16:9) ; ils sont poses dans /usr/lib/libretro/ a chaque
     demarrage par le service « hsfa » (/userdata/system/services/hsfa), voir installer-hsfa-batocera.sh.
     Coeur par defaut (Batocera n'utilise pas default="true") : hsfa.emulator=libretro et hsfa.core=fbneo_hsfa dans
     /userdata/system/batocera.conf (l'installeur les ecrit). -->
<systemList>
  <system>
    <fullname>Street Fighter Alpha HSFA</fullname>
    <name>hsfa</name>
    <manufacturer>Capcom</manufacturer>
    <release>2026</release>
    <hardware>arcade</hardware>
    <path>/userdata/roms/hsfa</path>
    <extension>.zip .7z</extension>
    <command>emulatorlauncher %CONTROLLERSCONFIG% -system %SYSTEM% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
    <platform>arcade</platform>
    <theme>fbneo</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">fbneo_hsfa</core>
          <core>fbneo_hsfaws</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
