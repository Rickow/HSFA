<?xml version="1.0" encoding="UTF-8"?>
<!-- Systeme « HSFA » pour RetroBat (Windows). NON ESSAYE : construit d'apres le modele officiel de RetroBat
     (system/templates/emulationstation/es_systems.cfg, systeme fbneo).
     A copier dans RetroBat\emulationstation\.emulationstation\es_systems_hsfa.cfg
     (PAS es_systems_custom.cfg : ce nom remplacerait toute la liste des systemes).
     Jeux : RetroBat\roms\hsfa\ ; coeurs : RetroBat\emulators\retroarch\cores\fbneo_hsfa_libretro.dll et
     fbneo_hsfaws_libretro.dll. -->
<systemList>
  <system>
    <name>hsfa</name>
    <fullname>Street Fighter Alpha HSFA</fullname>
    <manufacturer>Capcom</manufacturer>
    <release>2026</release>
    <hardware>arcade</hardware>
    <path>~\..\roms\hsfa</path>
    <extension>.zip .7z</extension>
    <command>"%HOME%\emulatorLauncher.exe" -gameinfo %GAMEINFOXML% %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM%</command>
    <platform>arcade</platform>
    <theme>fbneo</theme>
    <emulators>
      <emulator name="libretro">
        <cores>
          <core default="true">fbneo_hsfa</core>
          <core>fbneo_hsfaws</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
