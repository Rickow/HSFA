<?xml version="1.0" encoding="UTF-8"?>
<!-- Systeme « HSFA » pour EmulationStation de ROCKNIX.
     A copier dans /storage/.config/emulationstation/ (partage reseau : config/emulationstation/), puis
     redemarrer EmulationStation. Les jeux vont dans /storage/roms/hsfa/ (partage : roms/hsfa/).
     Coeur par defaut : fbneo_hsfa (4:3) ; fbneo_hsfaws (16:9) se choisit par jeu ou pour tout le systeme. -->
<systemList>
  <system>
    <name>hsfa</name>
    <fullname>Street Fighter Alpha HSFA</fullname>
    <manufacturer>Capcom</manufacturer>
    <release>2026</release>
    <hardware>arcade</hardware>
    <path>/storage/roms/hsfa</path>
    <extension>.zip .ZIP</extension>
    <command>/usr/bin/runemu.sh %ROM% -P%SYSTEM% --core=%CORE% --emulator=%EMULATOR% --controllers="%CONTROLLERSCONFIG%"</command>
    <platform>arcade</platform>
    <theme>cps2</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core default="true">fbneo_hsfa</core>
          <core>fbneo_hsfaws</core>
        </cores>
      </emulator>
    </emulators>
  </system>
</systemList>
